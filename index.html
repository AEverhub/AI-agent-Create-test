<!DOCTYPE html>
<html>
<head><title>迷宮遊戲</title></head>
<body>
<h1>迷宮遊戲</h1>
<canvas id="maze" width="400" height="400" style="border:1px solid #000;"></canvas>
<script>
const canvas = document.getElementById('maze');
const ctx = canvas.getContext('2d');
ctx.fillStyle = 'black';
ctx.fillRect(0, 0, 400, 400);
ctx.fillStyle = 'white';
ctx.fillRect(10, 10, 380, 380);
ctx.fillStyle = 'red';
ctx.fillRect(20, 20, 30, 30);
</script>
</body>
</html>
